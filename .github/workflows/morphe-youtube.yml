# Patches YouTube with the latest Morphe patches whenever Morphe releases a new version and
# publishes the signed APK as a release tagged morphe-youtube-<YouTube version>-<patches version>.
# Fermata (Settings > YouTube) installs these releases, see MorpheUpdater.java.
#
# Required secrets, so that every update is signed with the same key and installs over the
# previous one:
#   MORPHE_KEYSTORE_BASE64   base64 of the keystore file (base64 -w0 morphe.keystore).
#                            To update an app patched by Morphe Manager, export its keystore
#                            (Settings > Import & export > Export keystore) and use it here.
#   MORPHE_KEYSTORE_PASSWORD keystore password (optional, Morphe's default keystore has none)
#   MORPHE_KEY_ALIAS         key alias (optional, default: Morphe)
#   MORPHE_KEY_PASSWORD      key password (optional, default: Morphe)
#
# Optional repository variables:
#   MORPHE_STRIPLIBS         ABIs to keep, comma separated (default: arm64-v8a, "none" keeps all)

name: Morphe YouTube

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      youtube_version:
        description: 'YouTube version to patch (empty: the version recommended by the Morphe patches)'
        required: false
        default: ''
      apk_url:
        description: 'Direct URL of the YouTube APK/APKM/XAPK (empty: download from APKPure)'
        required: false
        default: ''
      force:
        description: 'Patch and release even if this version was released already'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: morphe-youtube
  cancel-in-progress: false

env:
  YT_PKG: com.google.android.youtube
  TAG_PREFIX: morphe-youtube-
  KEEP_RELEASES: 3

jobs:
  patch:
    name: Patch YouTube with Morphe
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download the latest Morphe patches and Morphe CLI
        run: |
          set -euo pipefail
          mkdir -p morphe
          patches_tag="$(gh release view -R MorpheApp/morphe-patches --json tagName -q .tagName)"
          gh release download "$patches_tag" -R MorpheApp/morphe-patches -p 'patches-*.mpp' -D morphe
          # The CLI is part of Morphe Desktop (formerly morphe-cli)
          gh release download -R MorpheApp/morphe-desktop -p 'morphe-*-all.jar' -D morphe
          ls -l morphe
          echo "PATCHES_TAG=$patches_tag" >> "$GITHUB_ENV"
          echo "MPP=$(ls morphe/patches-*.mpp | head -1)" >> "$GITHUB_ENV"
          echo "CLI=$(ls morphe/morphe-*-all.jar | head -1)" >> "$GITHUB_ENV"

      - name: Find the YouTube version to patch
        env:
          YT_VERSION: ${{ inputs.youtube_version }}
        run: |
          set -euo pipefail
          if [ -z "${YT_VERSION:-}" ]; then
            out="$(java -jar "$CLI" list-versions -p "$MPP" -f "$YT_PKG" 2>&1)"
            echo "$out"
            # The most common compatible version is listed first, e.g. 20.14.43
            YT_VERSION="$(grep -oE '\b[0-9]{2}\.[0-9]{2}\.[0-9]{2,3}\b' <<< "$out" | head -1 || true)"
          fi
          [ -n "$YT_VERSION" ] || { echo "::error::No compatible YouTube version found"; exit 1; }
          tag="${TAG_PREFIX}${YT_VERSION}-${PATCHES_TAG}"
          echo "YouTube $YT_VERSION, patches $PATCHES_TAG, release $tag"
          echo "YT_VERSION=$YT_VERSION" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - name: Check whether this version was released already
        id: check
        env:
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" != "true" ] && gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$TAG was released already"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download YouTube ${{ env.YT_VERSION }}
        if: steps.check.outputs.skip != 'true'
        env:
          APK_URL: ${{ inputs.apk_url }}
        run: |
          set -euo pipefail
          mkdir -p stock tools
          if [ -n "${APK_URL:-}" ]; then
            ext="${APK_URL%%\?*}"; ext="${ext##*.}"
            case "$ext" in apk|apkm|xapk|apks) ;; *) ext=apk ;; esac
            curl -fL --retry 3 -o "stock/youtube.$ext" "$APK_URL"
          else
            gh release download -R EFForg/apkeep -p 'apkeep-x86_64-unknown-linux-gnu' -D tools
            chmod +x tools/apkeep-x86_64-unknown-linux-gnu
            for i in 1 2 3; do
              tools/apkeep-x86_64-unknown-linux-gnu -a "$YT_PKG@$YT_VERSION" -d apk-pure stock && break
              sleep $((i * 20))
            done
          fi
          ls -l stock
          apk="$(ls stock/*.apk stock/*.apkm stock/*.xapk stock/*.apks 2>/dev/null | head -1 || true)"
          [ -n "$apk" ] || { echo "::error::Failed to download YouTube $YT_VERSION, run the workflow with apk_url"; exit 1; }
          echo "STOCK_APK=$apk" >> "$GITHUB_ENV"

      - name: Prepare the signing keystore
        if: steps.check.outputs.skip != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.MORPHE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::The MORPHE_KEYSTORE_BASE64 secret is not set. Updates must always be signed with the same key, see the comment at the top of this workflow."
            exit 1
          fi
          base64 -d <<< "$KEYSTORE_BASE64" > "$RUNNER_TEMP/morphe.keystore"

      - name: Patch YouTube ${{ env.YT_VERSION }} with Morphe ${{ env.PATCHES_TAG }}
        if: steps.check.outputs.skip != 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.MORPHE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MORPHE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MORPHE_KEY_PASSWORD }}
          STRIPLIBS: ${{ vars.MORPHE_STRIPLIBS || 'arm64-v8a' }}
        run: |
          set -euo pipefail
          mkdir -p out
          OUT="out/youtube-${YT_VERSION}-morphe-${PATCHES_TAG}.apk"
          args=(patch -p "$MPP" -o "$OUT" -t "$RUNNER_TEMP/morphe-tmp"
            --keystore "$RUNNER_TEMP/morphe.keystore"
            --keystore-entry-alias "${KEY_ALIAS:-Morphe}"
            --keystore-entry-password "${KEY_PASSWORD:-Morphe}")
          [ -n "${KEYSTORE_PASSWORD:-}" ] && args+=(--keystore-password "$KEYSTORE_PASSWORD")
          [ "$STRIPLIBS" != "none" ] && args+=(--striplibs "$STRIPLIBS")
          java -jar "$CLI" "${args[@]}" "$STOCK_APK"
          ls -l out
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      - name: Publish the release
        if: steps.check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          gh release delete "$TAG" -R "$GITHUB_REPOSITORY" --cleanup-tag -y > /dev/null 2>&1 || true
          notes="YouTube ${YT_VERSION} patched with [Morphe patches ${PATCHES_TAG}](https://github.com/MorpheApp/morphe-patches/releases/tag/${PATCHES_TAG}).

          Installed and updated automatically by Fermata (Settings > YouTube). Requires [MicroG-RE](https://github.com/MorpheApp/MicroG-RE) for signing in."
          gh release create "$TAG" "$OUT" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Morphe YouTube ${YT_VERSION} (${PATCHES_TAG})" --notes "$notes" --latest=false

      - name: Delete old Morphe YouTube releases
        if: steps.check.outputs.skip != 'true'
        run: |
          gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
            -q "sort_by(.createdAt) | reverse | .[].tagName | select(startswith(\"$TAG_PREFIX\"))" \
            | tail -n +$((KEEP_RELEASES + 1)) \
            | xargs -r -n1 gh release delete -R "$GITHUB_REPOSITORY" --cleanup-tag -y
